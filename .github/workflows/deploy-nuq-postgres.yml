name: Deploy NuQ Postgres to GHCR

on:
  push:
    branches:
      - main
    paths:
      - apps/nuq-postgres/**
      - .github/workflows/deploy-nuq-postgres.yml
  workflow_dispatch:

permissions: {}

jobs:
  build:
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            runner: ${{ github.repository_owner == 'firecrawl' && 'blacksmith-4vcpu-ubuntu-2404' || 'ubuntu-24.04' }}
          - platform: linux/arm64
            runner: ${{ github.repository_owner == 'firecrawl' && 'blacksmith-4vcpu-ubuntu-2404-arm' || 'ubuntu-24.04-arm' }}
    defaults:
      run:
        working-directory: './apps/nuq-postgres'
    steps:
      - name: 'Checkout GitHub Action'
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Setup Blacksmith Builder
        uses: docker/setup-buildx-action@v3

      - name: 'Login to GitHub Container Registry'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{github.actor}}
          password: ${{secrets.GITHUB_TOKEN}}

      - name: Lowercase Repo Owner
        run: |
          echo "REPO_OWNER=${GITHUB_REPOSITORY_OWNER,,}" >>${GITHUB_ENV}
        env:
          GITHUB_REPOSITORY_OWNER: '${{ github.repository_owner }}'

      - name: Extract platform suffix
        run: |
          platform=${{ matrix.platform }}
          echo "PLATFORM_SUFFIX=${platform//\//-}" >> $GITHUB_ENV

      - name: 'Build and Push Image'
        uses: docker/build-push-action@v6
        with:
          context: ./apps/nuq-postgres
          push: true
          tags: ghcr.io/${{ env.REPO_OWNER }}/nuq-postgres:${{ env.PLATFORM_SUFFIX }}
          platforms: ${{ matrix.platform }}
          provenance: false

  manifest:
    runs-on: ${{ github.repository_owner == 'firecrawl' && 'blacksmith-2vcpu-ubuntu-2404' || 'ubuntu-24.04' }}
    needs: build
    environment: ghcr-publish
    permissions:
      packages: write
    steps:
      - name: 'Login to GitHub Container Registry'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{github.actor}}
          password: ${{secrets.GITHUB_TOKEN}}

      - name: Lowercase Repo Owner
        run: |
          echo "REPO_OWNER=${GITHUB_REPOSITORY_OWNER,,}" >>${GITHUB_ENV}
        env:
          GITHUB_REPOSITORY_OWNER: '${{ github.repository_owner }}'

      - name: 'Create and Push Multi-Arch Manifest'
        run: |
          docker manifest create ghcr.io/${{ env.REPO_OWNER }}/nuq-postgres:latest \
            ghcr.io/${{ env.REPO_OWNER }}/nuq-postgres:linux-amd64 \
            ghcr.io/${{ env.REPO_OWNER }}/nuq-postgres:linux-arm64
          docker manifest push ghcr.io/${{ env.REPO_OWNER }}/nuq-postgres:latest
